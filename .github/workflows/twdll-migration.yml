name: TWDLL one-shot monorepo migration

on:
  push:
    branches:
      - chore/36-twdll-monorepo

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MK1212Scripts branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned upstream snapshots
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/karnalooch/twdll.git "$RUNNER_TEMP/twdll-src"
          git -C "$RUNNER_TEMP/twdll-src" checkout --detach 85c4db9836e3150df8ec5b38315de9940f8d624c
          git clone --no-checkout https://github.com/TsudaKageyu/minhook.git "$RUNNER_TEMP/minhook-src"
          git -C "$RUNNER_TEMP/minhook-src" checkout --detach d94c64d32ea37bc4f5ee47d580709f70c6fb6080

      - name: Complete exact twdll snapshot and vendor MinHook
        shell: bash
        run: |
          set -euo pipefail

          copy_exact() {
            local rel="$1"
            mkdir -p "native/twdll/$(dirname "$rel")"
            cp -f "$RUNNER_TEMP/twdll-src/$rel" "native/twdll/$rel"
          }

          copy_exact docs/lua/include/luafilesystem/doc/us/luafilesystem.png
          copy_exact docs/lua/lua_source/doc/amazon.gif
          copy_exact docs/lua/lua_source/doc/cover.png
          copy_exact docs/lua/lua_source/doc/logo.gif
          copy_exact docs/lua/lua_source/etc/lua.ico
          copy_exact tests/attila/extra.pack
          copy_exact tests/attila/tests.save
          copy_exact tests/rome2/tests.save

          rm -rf native/twdll/vendor/minhook
          mkdir -p native/twdll/vendor/minhook
          cp -a "$RUNNER_TEMP/minhook-src/." native/twdll/vendor/minhook/
          rm -rf native/twdll/vendor/minhook/.git
          rm -f native/twdll/.gitmodules

          # One-shot workflow: remove itself from the final migration commit.
          rm -f .github/workflows/twdll-migration.yml

      - name: Verify exact binary provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object native/twdll/tests/attila/tests.save)" = "17840d85fe5ca6300f2b251bdfe5a352e351d702"
          test "$(git hash-object native/twdll/tests/rome2/tests.save)" = "d60dc6e3503358e9ca3fc414d3f7fadd2a8752c7"
          test "$(git -C "$RUNNER_TEMP/minhook-src" rev-parse HEAD)" = "d94c64d32ea37bc4f5ee47d580709f70c6fb6080"
          test -f native/twdll/vendor/minhook/LICENSE.txt
          test -f native/twdll/vendor/minhook/CMakeLists.txt
          test -f native/twdll/vendor/minhook/include/MinHook.h

      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A native/twdll .github/workflows/twdll-migration.yml
          if git diff --cached --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git commit -m "chore(native): complete twdll snapshot and vendor MinHook"
          git push origin "HEAD:${GITHUB_REF_NAME}"
