name: TWDLL snapshot integrity repair

on:
  push:
    branches:
      - chore/36-twdll-monorepo

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned snapshots
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/karnalooch/twdll.git "$RUNNER_TEMP/twdll-src"
          git -C "$RUNNER_TEMP/twdll-src" checkout --detach 85c4db9836e3150df8ec5b38315de9940f8d624c
          git clone --no-checkout https://github.com/TsudaKageyu/minhook.git "$RUNNER_TEMP/minhook-src"
          git -C "$RUNNER_TEMP/minhook-src" checkout --detach d94c64d32ea37bc4f5ee47d580709f70c6fb6080

      - name: Repair exact source mismatches and force-add vendored MinHook
        shell: bash
        run: |
          set -euo pipefail
          for rel in \
            docs/attila/topics/engine_tweakers_inventory.md.html \
            docs/engine_tweakers_inventory.md \
            docs/lua/lua_source/test/life.lua
          do
            mkdir -p "native/twdll/$(dirname "$rel")"
            cp -f "$RUNNER_TEMP/twdll-src/$rel" "native/twdll/$rel"
          done

          rm -rf native/twdll/vendor/minhook
          mkdir -p native/twdll/vendor/minhook
          cp -a "$RUNNER_TEMP/minhook-src/." native/twdll/vendor/minhook/
          rm -rf native/twdll/vendor/minhook/.git
          rm -f native/twdll/.gitmodules
          rm -f .github/workflows/twdll-integrity-repair.yml

          git add -A native/twdll .github/workflows/twdll-integrity-repair.yml
          git add -f native/twdll/vendor/minhook

      - name: Verify every imported twdll blob
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS=$'\t' read -r meta rel; do
            mode="${meta%% *}"
            rest="${meta#* }"
            type="${rest%% *}"
            sha="${rest##* }"
            case "$rel" in
              .github/workflows/*|.gitmodules|vendor/minhook) continue ;;
            esac
            dst="native/twdll/$rel"
            if [ "$type" != "blob" ] || [ ! -f "$dst" ]; then
              echo "missing/type mismatch: $rel"
              bad=1
              continue
            fi
            actual="$(git hash-object "$dst")"
            if [ "$actual" != "$sha" ]; then
              echo "hash mismatch: $rel expected=$sha actual=$actual"
              bad=1
            fi
          done < <(git -C "$RUNNER_TEMP/twdll-src" ls-tree -r HEAD)
          test "$bad" -eq 0

      - name: Verify every vendored MinHook blob
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS=$'\t' read -r meta rel; do
            sha="${meta##* }"
            dst="native/twdll/vendor/minhook/$rel"
            if [ ! -f "$dst" ]; then
              echo "missing MinHook file: $rel"
              bad=1
              continue
            fi
            actual="$(git hash-object "$dst")"
            if [ "$actual" != "$sha" ]; then
              echo "MinHook hash mismatch: $rel expected=$sha actual=$actual"
              bad=1
            fi
          done < <(git -C "$RUNNER_TEMP/minhook-src" ls-tree -r HEAD)
          test "$bad" -eq 0

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git commit -m "chore(native): verify exact twdll and MinHook snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
