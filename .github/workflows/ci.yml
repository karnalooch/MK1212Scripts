name: Gumball CI

on:
  pull_request:
    branches:
      - master
      - feat/44-mk1212-twdll-runtime-integration # stacked PR #61 CI; remove once parent merges
  push:
    branches:
      - master
      - feat/35-turn-observation-v1 # temporary exact-HEAD proof on stacked PR
  workflow_dispatch:

permissions: {}

concurrency:
  group: gumball-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository_policy:
    name: Repository policy
    uses: karnalooch/engineering-platform/.github/workflows/reusable-repo-policy.yml@ddc458c223b8020c5f36482415d4405459bd373a
    with:
      max_non_lfs_mib: 10
    permissions:
      contents: read

  governance:
    name: Governance
    uses: karnalooch/engineering-platform/.github/workflows/reusable-governance.yml@ddc458c223b8020c5f36482415d4405459bd373a
    with:
      require_manual_merge_marker: true
    permissions:
      contents: read

  security:
    name: Security
    uses: karnalooch/engineering-platform/.github/workflows/reusable-security.yml@ddc458c223b8020c5f36482415d4405459bd373a
    with:
      enable_dependency_review: false
      enable_codeql: false
      enable_trivy: true
      enable_sbom: false
      enable_docs_only_light_lane: true
    permissions:
      contents: read
      security-events: write

  repository_static:
    name: Repository static contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${EXPECTED_SHA}" ]]; then
            echo "Expected exact caller-local revision ${EXPECTED_SHA}, got ${actual}" >&2
            exit 1
          fi

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Gumball doctor
        run: python scripts/gumball.py doctor

      - name: Validate MK1212 repository shape
        run: python scripts/ci/check_repository.py

      - name: Run twdll native source contracts
        run: python -m unittest discover -s scripts/ci -p "test_twdll_*.py" -v

      - name: Test product probe packaging
        run: python -m unittest discover -s scripts/ci -p "test_product_probe.py" -v

      - name: Test TurnObservationV1 source and safety contracts
        run: python -m unittest discover -s scripts/ci -p "test_turn_observation_v1.py" -v

      - name: Guard multiplayer-sensitive Lua additions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python scripts/ci/check_mp_safety_diff.py --base "${BASE_SHA}"

      - name: Run deterministic MP dual-peer simulation
        run: python -m unittest discover -s scripts/ci -p "test_mp_*.py" -v

  native_twdll:
    name: Native twdll Attila build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Expected exact caller-local revision $env:EXPECTED_SHA, got $actual"
          }

      - name: Configure Attila x86 build
        shell: pwsh
        run: cmake -S native/twdll -B build/twdll-attila -A Win32 -DTW_GAME=attila -DBUILD_TESTING=ON -DTWDLL_WARNINGS_AS_ERRORS=ON

      - name: Build Release twdll and native stress tests
        shell: pwsh
        run: cmake --build build/twdll-attila --config Release --target twdll twdll_signature_scanner_tests twdll_log_tests twdll_security_tests --parallel 2

      - name: Run Release native stress tests
        shell: pwsh
        run: ctest --test-dir build/twdll-attila -C Release --output-on-failure

      - name: Build Debug twdll and native stress tests
        shell: pwsh
        run: cmake --build build/twdll-attila --config Debug --target twdll twdll_signature_scanner_tests twdll_log_tests twdll_security_tests --parallel 2

      - name: Run Debug native stress tests
        shell: pwsh
        run: ctest --test-dir build/twdll-attila -C Debug --output-on-failure

      - name: Verify Attila DLL PE contract
        shell: pwsh
        run: |
          $dll = Resolve-Path "build/twdll-attila/Release/twdll.dll"
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          if ($bytes.Length -lt 64) {
            throw "Built twdll.dll is too small to be a valid PE image."
          }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) {
            throw "Built twdll.dll has an invalid PE header offset."
          }
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0x00 -or $bytes[$peOffset + 3] -ne 0x00) {
            throw "Built twdll.dll is missing the PE signature."
          }

          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014c) {
            throw ("Expected PE32/x86 IMAGE_FILE_MACHINE_I386 (0x014c), got 0x{0:x4}." -f $machine)
          }

          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $ascii.Contains("luaopen_twdll")) {
            throw "Built twdll.dll does not contain the luaopen_twdll export marker."
          }

          Write-Host ("Native artifact contract PASS: {0}; machine=0x{1:x4}; luaopen_twdll present" -f $dll, $machine)

      - name: Parse product SP harness
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/runtime/RUN-MK1212-PR45-SP-TEST.ps1'),
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

      - name: Build complete exact-head product SP probe
        shell: pwsh
        run: |
          $url = 'https://github.com/Frodo45127/rpfm/releases/download/v4.6.3/rpfm-v4.6.3-x86_64-pc-windows-msvc.zip'
          Invoke-WebRequest $url -OutFile build/rpfm.zip
          $expected = 'a3f9a5ac7704b7703f460a722608a4baf28544b174daeddd4ca85f5e4d6b3e3a'
          if ((Get-FileHash build/rpfm.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Pinned RPFM release hash mismatch'
          }
          Expand-Archive build/rpfm.zip build/rpfm
          $cli = @(Get-ChildItem build/rpfm -Recurse -Filter rpfm_cli.exe)
          if ($cli.Count -ne 1) { throw 'Expected exactly one RPFM CLI' }
          python scripts/runtime/build_product_probe.py --dll build/twdll-attila/Release/twdll.dll --rpfm $cli[0].FullName --output build/product-probe
          if ($LASTEXITCODE -ne 0) { throw 'Product probe build failed' }

      - name: Test SP harness rollback on synthetic files
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem build/product-probe -Filter '*.zip')
          if ($zip.Count -ne 1) { throw 'Expected one probe ZIP' }
          Expand-Archive $zip[0].FullName build/rollback-probe
          ./scripts/ci/test_product_probe_rollback.ps1 -ProbeRoot (Resolve-Path build/rollback-probe)

      - name: Upload exact-head product SP probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mk1212-product-sp-probe-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/product-probe/*.zip
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Aggregate CI gate
    needs:
      - repository_policy
      - governance
      - security
      - repository_static
      - native_twdll
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Require all baseline evidence
        env:
          REPOSITORY_POLICY: ${{ needs.repository_policy.result }}
          GOVERNANCE: ${{ needs.governance.result }}
          SECURITY: ${{ needs.security.result }}
          REPOSITORY_STATIC: ${{ needs.repository_static.result }}
          NATIVE_TWDLL: ${{ needs.native_twdll.result }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for item in \
            "repository_policy=${REPOSITORY_POLICY}" \
            "governance=${GOVERNANCE}" \
            "security=${SECURITY}" \
            "repository_static=${REPOSITORY_STATIC}" \
            "native_twdll=${NATIVE_TWDLL}"; do
            name="${item%%=*}"
            result="${item#*=}"
            printf '%s: %s\n' "${name}" "${result}"
            if [[ "${result}" != "success" ]]; then
              failed=1
            fi
          done
          exit "${failed}"
