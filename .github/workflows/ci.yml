name: Gumball CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: gumball-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository_policy:
    name: Repository policy
    uses: karnalooch/engineering-platform/.github/workflows/reusable-repo-policy.yml@ddc458c223b8020c5f36482415d4405459bd373a
    with:
      max_non_lfs_mib: 10
    permissions:
      contents: read

  governance:
    name: Governance
    uses: karnalooch/engineering-platform/.github/workflows/reusable-governance.yml@ddc458c223b8020c5f36482415d4405459bd373a
    with:
      require_manual_merge_marker: true
    permissions:
      contents: read

  security:
    name: Security
    uses: karnalooch/engineering-platform/.github/workflows/reusable-security.yml@ddc458c223b8020c5f36482415d4405459bd373a
    with:
      enable_dependency_review: false
      enable_codeql: false
      enable_trivy: true
      enable_sbom: false
      enable_docs_only_light_lane: true
    permissions:
      contents: read
      security-events: write

  repository_static:
    name: Repository static contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${EXPECTED_SHA}" ]]; then
            echo "Expected exact caller-local revision ${EXPECTED_SHA}, got ${actual}" >&2
            exit 1
          fi

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Gumball doctor
        run: python scripts/gumball.py doctor

      - name: Validate MK1212 repository shape
        run: python scripts/ci/check_repository.py

      - name: Guard multiplayer-sensitive Lua additions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python scripts/ci/check_mp_safety_diff.py --base "${BASE_SHA}"

      - name: Run deterministic MP dual-peer simulation
        run: python -m unittest discover -s scripts/ci -p "test_mp_*.py" -v

      - name: Verify exact-source dual-client package contracts
        run: python -m unittest discover -s scripts/ci -p "test_dual_client_package.py" -v

      - name: Verify Goldberg package provenance and preservation contracts
        run: python -m unittest discover -s scripts/ci -p "test_goldberg_client_package.py" -v

      - name: Verify Windows installer packaging contracts
        run: python -m unittest discover -s scripts/ci -p "test_goldberg_installer.py" -v

  native_twdll:
    name: Native twdll Attila build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Expected exact caller-local revision $env:EXPECTED_SHA, got $actual"
          }

      - name: Configure Attila x86 build
        shell: pwsh
        run: cmake -S native/twdll -B build/twdll-attila -A Win32 -DTW_GAME=attila -DBUILD_TESTING=ON

      - name: Build twdll target
        shell: pwsh
        run: cmake --build build/twdll-attila --config Release --target twdll --parallel 2

      - name: Build native scanner tests
        shell: pwsh
        run: cmake --build build/twdll-attila --config Release --target twdll_signature_scanner_tests --parallel 2

      - name: Run native scanner tests
        shell: pwsh
        run: ctest --test-dir build/twdll-attila -C Release --output-on-failure

      - name: Verify Attila DLL PE contract
        shell: pwsh
        run: |
          $dll = Resolve-Path "build/twdll-attila/Release/twdll.dll"
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          if ($bytes.Length -lt 64) {
            throw "Built twdll.dll is too small to be a valid PE image."
          }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) {
            throw "Built twdll.dll has an invalid PE header offset."
          }
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0x00 -or $bytes[$peOffset + 3] -ne 0x00) {
            throw "Built twdll.dll is missing the PE signature."
          }

          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014c) {
            throw ("Expected PE32/x86 IMAGE_FILE_MACHINE_I386 (0x014c), got 0x{0:x4}." -f $machine)
          }

          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $ascii.Contains("luaopen_twdll")) {
            throw "Built twdll.dll does not contain the luaopen_twdll export marker."
          }

          Write-Host ("Native artifact contract PASS: {0}; machine=0x{1:x4}; luaopen_twdll present" -f $dll, $machine)

      - name: Test dual-client lab in Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/ci/test_dual_client_lab.ps1

      - name: Test dual-client lab in PowerShell 7
        shell: pwsh
        run: ./scripts/ci/test_dual_client_lab.ps1

      - name: Set up Python 3.14 for operator package
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Fetch and verify the pinned original Goldberg archive
        env:
          PACKAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: python scripts/ci/build_goldberg_client_lab.py --source-sha $env:PACKAGE_SOURCE_SHA --fetch-only --archive build/goldberg-upstream.zip

      - name: Test Goldberg lab in Windows PowerShell 5.1
        env:
          GOLDBERG_ARCHIVE_PATH: ${{ github.workspace }}/build/goldberg-upstream.zip
        shell: powershell
        run: ./scripts/ci/test_goldberg_client_lab.ps1

      - name: Test Goldberg lab in PowerShell 7
        env:
          GOLDBERG_ARCHIVE_PATH: ${{ github.workspace }}/build/goldberg-upstream.zip
        shell: pwsh
        run: ./scripts/ci/test_goldberg_client_lab.ps1

      - name: Build exact-source Goldberg lab package
        env:
          PACKAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: python scripts/ci/build_goldberg_client_lab.py --source-sha $env:PACKAGE_SOURCE_SHA --archive build/goldberg-upstream.zip

      - name: Compile exact-source Windows installer
        env:
          PACKAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          $package = "build/goldberg-client-lab/mk1212-goldberg-client-lab-$env:PACKAGE_SOURCE_SHA/mk1212-goldberg-client-lab-$env:PACKAGE_SOURCE_SHA.zip"
          python scripts/ci/build_goldberg_installer.py --source-sha $env:PACKAGE_SOURCE_SHA --package $package

      - name: Test installed toolkit in Windows PowerShell 5.1
        env:
          PACKAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: powershell
        run: ./scripts/ci/test_goldberg_setup.ps1 -PackageRootPath "build/goldberg-installer/$env:PACKAGE_SOURCE_SHA/payload"

      - name: Test installed toolkit in PowerShell 7
        env:
          PACKAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: ./scripts/ci/test_goldberg_setup.ps1 -PackageRootPath "build/goldberg-installer/$env:PACKAGE_SOURCE_SHA/payload"

      - name: Exercise the compiled installer failure boundary
        env:
          PACKAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: ./scripts/ci/test_goldberg_installer.ps1 -InstallerPath "build/goldberg-installer/$env:PACKAGE_SOURCE_SHA/MK1212-Setup-$($env:PACKAGE_SOURCE_SHA.Substring(0,12)).exe"

      - name: Upload Windows installer and exact build identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mk1212-goldberg-installer-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/goldberg-installer/${{ github.event.pull_request.head.sha || github.sha }}/*.exe
            build/goldberg-installer/${{ github.event.pull_request.head.sha || github.sha }}/installer-build.json
            build/goldberg-installer/${{ github.event.pull_request.head.sha || github.sha }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Goldberg lab package with upstream source and notices
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mk1212-goldberg-client-lab-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/goldberg-client-lab/mk1212-goldberg-client-lab-${{ github.event.pull_request.head.sha || github.sha }}/
          if-no-files-found: error
          retention-days: 30

      - name: Build exact-source dual-client lab package
        env:
          PACKAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: python scripts/ci/build_dual_client_lab.py --source-sha $env:PACKAGE_SOURCE_SHA

      - name: Upload dual-client lab package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mk1212-dual-client-lab-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/dual-client-lab/mk1212-dual-client-lab-${{ github.event.pull_request.head.sha || github.sha }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate CI gate
    needs:
      - repository_policy
      - governance
      - security
      - repository_static
      - native_twdll
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Require all baseline evidence
        env:
          REPOSITORY_POLICY: ${{ needs.repository_policy.result }}
          GOVERNANCE: ${{ needs.governance.result }}
          SECURITY: ${{ needs.security.result }}
          REPOSITORY_STATIC: ${{ needs.repository_static.result }}
          NATIVE_TWDLL: ${{ needs.native_twdll.result }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for item in \
            "repository_policy=${REPOSITORY_POLICY}" \
            "governance=${GOVERNANCE}" \
            "security=${SECURITY}" \
            "repository_static=${REPOSITORY_STATIC}" \
            "native_twdll=${NATIVE_TWDLL}"; do
            name="${item%%=*}"
            result="${item#*=}"
            printf '%s: %s\n' "${name}" "${result}"
            if [[ "${result}" != "success" ]]; then
              failed=1
            fi
          done
          exit "${failed}"
