            "2. Add: mod `"mk1212_twdll_sp_probe.pack`"; to the active user.script.txt / enable the pack last.",
            "3. Copy DROP-IN/twdll_attila.dll next to Attila.exe.",
            "4. Start an MK1212 single-player campaign and enter the map.",
            "5. Close the game normally and send twdll.log.",
            "",
            "FAST MANUAL LOAD TEST:",
            "1. Back up existing twdll.dll / twdll_attila.dll in the Total War Attila folder.",
            "2. Copy both DLL files from DROP-IN next to Attila.exe.",
