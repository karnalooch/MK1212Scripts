          Compress-Archive -Path "$root" -DestinationPath "MK1212-twdll-Attila-7c6f5b6d691313f128e9212e37c87c2292e79504.zip" -Force

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: MK1212-twdll-Attila-7c6f5b6d691313f128e9212e37c87c2292e79504
