name: Build twdll Attila runtime test bundle

on:
  push:
    branches:
      - artifact/43-attila-runtime-bundle

permissions:
  contents: read

jobs:
  package:
    name: Exact-head Attila runtime bundle
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: packaging

      - name: Checkout exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 7c6f5b6d691313f128e9212e37c87c2292e79504
          path: source

      - name: Assert exact source revision
        shell: pwsh
        run: |
          Push-Location source
          $actual = (git rev-parse HEAD).Trim()
          Pop-Location
          if ($actual -ne "7c6f5b6d691313f128e9212e37c87c2292e79504") {
            throw "Expected 7c6f5b6d691313f128e9212e37c87c2292e79504, got $actual"
          }

      - name: Configure Attila x86 Release
        shell: pwsh
        run: cmake -S source/native/twdll -B build/twdll-attila -A Win32 -DTW_GAME=attila -DBUILD_TESTING=ON -DTWDLL_WARNINGS_AS_ERRORS=ON

      - name: Build DLL and native stress tests
        shell: pwsh
        run: cmake --build build/twdll-attila --config Release --target twdll twdll_signature_scanner_tests twdll_log_tests twdll_security_tests --parallel 2

      - name: Run native stress tests
        shell: pwsh
        run: ctest --test-dir build/twdll-attila -C Release --output-on-failure

      - name: Verify DLL contract and embedded build SHA
        shell: pwsh
        run: |
          $dll = Resolve-Path "build/twdll-attila/Release/twdll.dll"
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014c) { throw ("Expected PE32/x86 0x014c, got 0x{0:x4}" -f $machine) }
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $ascii.Contains("luaopen_twdll")) { throw "luaopen_twdll marker missing" }
          if (-not $ascii.Contains("7c6f5b6d691313f128e9212e37c87c2292e79504")) { throw "Embedded exact source SHA missing" }

      - name: Install RPFM CLI 4.5.4
        shell: pwsh
        run: |
          cargo install rpfm_cli --version 4.5.4 --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo install rpfm_cli failed" }
          $cli = Join-Path $env:USERPROFILE ".cargo/bin/rpfm_cli.exe"
          if (!(Test-Path $cli)) { throw "Installed rpfm_cli.exe not found at $cli" }
          "RPFM_CLI=$cli" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build single-player runtime probe pack
        shell: pwsh
        run: |
          & "$env:RPFM_CLI" --game attila pack create --pack-path "mk1212_twdll_sp_probe.pack"
          if ($LASTEXITCODE -ne 0) { throw "RPFM pack create failed" }
          & "$env:RPFM_CLI" --game attila pack add --pack-path "mk1212_twdll_sp_probe.pack" -F "packaging/artifact/sp-probe-pack;"
          if ($LASTEXITCODE -ne 0) { throw "RPFM pack add failed" }
          $pack = Get-Item "mk1212_twdll_sp_probe.pack"
          if ($pack.Length -le 0) { throw "Probe pack is empty" }
          Write-Host "Probe pack bytes: $($pack.Length)"

      - name: Assemble runtime bundle
        shell: pwsh
        run: |
          $root = "MK1212-twdll-Attila-SP-PROBE-7c6f5b6d691313f128e9212e37c87c2292e79504"
          New-Item -ItemType Directory -Force -Path "$root/DROP-IN" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/TEST-SOURCES" | Out-Null

          Copy-Item "build/twdll-attila/Release/twdll.dll" "$root/DROP-IN/twdll.dll"
          Copy-Item "build/twdll-attila/Release/twdll.dll" "$root/DROP-IN/twdll_attila.dll"
          Copy-Item "build/twdll-attila/Release/twdll.pdb" "$root/DROP-IN/twdll.pdb"
          Copy-Item "mk1212_twdll_sp_probe.pack" "$root/mk1212_twdll_sp_probe.pack"

          Copy-Item -Recurse "source/native/twdll/tests/shared" "$root/TEST-SOURCES/shared"
          Copy-Item -Recurse "source/native/twdll/tests/attila" "$root/TEST-SOURCES/attila"

          $readme = @(
            "MK1212 / twdll ATTILA SINGLE-PLAYER RUNTIME PROBE",
            "================================================",
            "Exact source SHA: 7c6f5b6d691313f128e9212e37c87c2292e79504",
            "",
            "INSTALL:",
            "1. Copy DROP-IN/twdll_attila.dll next to Attila.exe.",
            "2. Copy mk1212_twdll_sp_probe.pack into the Attila/data folder.",
            "3. Enable mk1212_twdll_sp_probe.pack AFTER the normal MK1212 packs.",
            "   If using user.script.txt, add: mod `"mk1212_twdll_sp_probe.pack`";",
            "4. Start MK1212 SINGLE PLAYER and enter the campaign map.",
            "5. Play one turn, save, load, then exit normally.",
            "6. Send back twdll.log from the Attila.exe directory.",
            "",
            "REMOVE AFTER TEST:",
            "Delete/disable mk1212_twdll_sp_probe.pack. It only forces the optional runtime adapter to initialize in SP.",
            "",
            "Expected build SHA: 7c6f5b6d691313f128e9212e37c87c2292e79504"
          )
          $readme | Set-Content -Encoding UTF8 "$root/README-FIRST.txt"

          $manifest = [ordered]@{
            source_sha = "7c6f5b6d691313f128e9212e37c87c2292e79504"
            target_game = "Total War: ATTILA"
            architecture = "x86"
            mode = "single-player runtime probe"
            runtime_proof = "NOT_RUN"
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 "$root/MANIFEST.json"

          Get-ChildItem -Path "$root" -Recurse -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object {
              $relative = $_.Path.Substring((Resolve-Path $root).Path.Length + 1)
              "$($_.Hash.ToLower())  $relative"
            } |
            Set-Content -Encoding ASCII "$root/SHA256SUMS.txt"

          Compress-Archive -Path "$root" -DestinationPath "MK1212-twdll-Attila-SP-PROBE-7c6f5b6d691313f128e9212e37c87c2292e79504.zip" -Force

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: MK1212-twdll-Attila-SP-PROBE-7c6f5b6d691313f128e9212e37c87c2292e79504
          path: MK1212-twdll-Attila-SP-PROBE-7c6f5b6d691313f128e9212e37c87c2292e79504.zip
          retention-days: 7
          if-no-files-found: error
