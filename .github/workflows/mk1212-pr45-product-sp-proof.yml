name: Build MK1212 product SP runtime proof bundle

on:
  push:
    branches:
      - artifact/45-mk1212-product-sp-proof

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: helper

      - name: Checkout exact PR45 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 13ba7dc5965c43b252de88f7fd4cefe75f1f82b1
          path: source

      - name: Assert exact source
        shell: pwsh
        run: |
          Push-Location source
          $actual = (git rev-parse HEAD).Trim()
          Pop-Location
          if ($actual -ne "13ba7dc5965c43b252de88f7fd4cefe75f1f82b1") { throw "Expected 13ba7dc5965c43b252de88f7fd4cefe75f1f82b1, got $actual" }

      - name: Configure and build Attila x86 DLL
        shell: pwsh
        run: |
          cmake -S source/native/twdll -B build/twdll-attila -A Win32 -DTW_GAME=attila -DBUILD_TESTING=ON -DTWDLL_WARNINGS_AS_ERRORS=ON
          cmake --build build/twdll-attila --config Release --target twdll twdll_signature_scanner_tests twdll_log_tests twdll_security_tests --parallel 2
          ctest --test-dir build/twdll-attila -C Release --output-on-failure

      - name: Verify DLL identity
        shell: pwsh
        run: |
          $dll = Resolve-Path "build/twdll-attila/Release/twdll.dll"
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014c) { throw "Expected x86 DLL" }
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $ascii.Contains("luaopen_twdll")) { throw "luaopen_twdll marker missing" }
          if (-not $ascii.Contains("13ba7dc5965c43b252de88f7fd4cefe75f1f82b1")) { throw "Exact source SHA missing from DLL" }

      - name: Install prebuilt RPFM CLI 4.5.4
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Frodo45127/rpfm/releases/download/v4.5.4/rpfm-v4.5.4-x86_64-pc-windows-msvc.zip" -OutFile "rpfm.zip"
          Expand-Archive "rpfm.zip" -DestinationPath "rpfm" -Force
          $cli = Get-ChildItem "rpfm" -Recurse -File | Where-Object { $_.Name -like "rpfm_cli*" } | Select-Object -First 1
          if (-not $cli) { throw "rpfm_cli not found" }
          Write-Host "RPFM CLI: $($cli.FullName)"
          "RPFM_CLI=$($cli.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage exact MK1212 runtime patch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "patch-src/campaigns/main_attila/common" | Out-Null
          Copy-Item "source/campaigns/main_attila/common/main.lua" "patch-src/campaigns/main_attila/common/main.lua"
          Copy-Item "source/campaigns/main_attila/common/mkmp_runtime.lua" "patch-src/campaigns/main_attila/common/mkmp_runtime.lua"

      - name: Prove RPFM clone-and-replace semantics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "base-src/campaigns/main_attila/common" | Out-Null
          "-- OLD_MAIN_SENTINEL" | Set-Content -Encoding ASCII "base-src/campaigns/main_attila/common/main.lua"
          "-- OLD_RUNTIME_SENTINEL" | Set-Content -Encoding ASCII "base-src/campaigns/main_attila/common/mkmp_runtime.lua"

          & "$env:RPFM_CLI" --game attila pack create --pack-path "replacement-proof.pack"
          if ($LASTEXITCODE -ne 0) { throw "RPFM create failed" }
          & "$env:RPFM_CLI" --game attila pack add --pack-path "replacement-proof.pack" -F "base-src;"
          if ($LASTEXITCODE -ne 0) { throw "RPFM base add failed" }
          & "$env:RPFM_CLI" --game attila pack add --pack-path "replacement-proof.pack" -F "patch-src;"
          if ($LASTEXITCODE -ne 0) { throw "RPFM replacement add failed" }

          $raw = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes("replacement-proof.pack"))
          if (-not $raw.Contains("MKMP_RUNTIME_EXPECTED_GAME")) { throw "Patched runtime marker not found in pack" }
          if (-not $raw.Contains("MKMP_Runtime_Initialize")) { throw "Patched bootstrap marker not found in pack" }
          if ($raw.Contains("OLD_RUNTIME_SENTINEL")) { throw "Old runtime payload survived replacement" }

      - name: Validate CA launcher JSON parser on Windows PowerShell 5.1
        shell: powershell
        run: |
          $sample = @'
[{"uuid":"1-1212allscriptsdisabled.pack","order":1,"active":false,"packfile":"D:/SteamLibrary/steamapps/workshop/content/325610/3148519158/1-1212allscriptsdisabled.pack"},{"uuid":"1-1212scripts.pack","order":2,"active":true,"packfile":"D:/SteamLibrary/steamapps/workshop/content/325610/1934544571/1-1212scripts.pack"},{"uuid":"1212compbuild_v2.pack","order":4,"active":true,"packfile":"D:/SteamLibrary/steamapps/workshop/content/325610/1429109380/1212compbuild_v2.pack"}]
'@

          $parsedModData = $sample | ConvertFrom-Json
          $mods = New-Object System.Collections.ArrayList

          if ($parsedModData -is [System.Array]) {
              foreach ($entry in $parsedModData) {
                  if ($entry -is [System.Array]) {
                      foreach ($inner in $entry) { [void]$mods.Add($inner) }
                  } else {
                      [void]$mods.Add($entry)
                  }
              }
          } else {
              [void]$mods.Add($parsedModData)
          }

          $scriptCandidates = New-Object System.Collections.ArrayList
          foreach ($m in $mods) {
              $uuid = [string]($m.uuid)
              $packfile = [string]($m.packfile)
              $normalizedPack = $packfile.Replace("\\", "/").ToLowerInvariant()
              if ($uuid -eq "1-1212scripts.pack" -or $normalizedPack.EndsWith("/1-1212scripts.pack")) {
                  [void]$scriptCandidates.Add($m)
              }
          }

          if ($mods.Count -ne 3) { throw "Expected 3 flattened records, got $($mods.Count)" }
          if ($scriptCandidates.Count -ne 1) { throw "Expected exactly one scripts record, got $($scriptCandidates.Count)" }

          $selected = $scriptCandidates[0]
          $path = [string]($selected.packfile)

          if ([string]($selected.uuid) -ne "1-1212scripts.pack") { throw "Wrong uuid selected" }
          if ($path -ne "D:/SteamLibrary/steamapps/workshop/content/325610/1934544571/1-1212scripts.pack") {
              throw "Wrong scalar pack path selected: $path"
          }

          Write-Host "Windows PowerShell 5.1 launcher JSON parser contract PASS: $path"

      - name: Assemble product proof bundle
        shell: pwsh
        run: |
          $root = "MK1212-PR45-PRODUCT-SP-PROOF-13ba7dc5965c43b252de88f7fd4cefe75f1f82b1"
          New-Item -ItemType Directory -Force -Path "$root/payload/patch-src/campaigns/main_attila/common" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/tools" | Out-Null

          Copy-Item "build/twdll-attila/Release/twdll.dll" "$root/payload/twdll.dll"
          Copy-Item "build/twdll-attila/Release/twdll.dll" "$root/payload/twdll_attila.dll"
          Copy-Item "patch-src/campaigns/main_attila/common/main.lua" "$root/payload/patch-src/campaigns/main_attila/common/main.lua"
          Copy-Item "patch-src/campaigns/main_attila/common/mkmp_runtime.lua" "$root/payload/patch-src/campaigns/main_attila/common/mkmp_runtime.lua"
          Copy-Item "$env:RPFM_CLI" "$root/tools/rpfm_cli.exe"

          Copy-Item "helper/artifact/product-sp-proof/RUN-MK1212-PR45-SP-TEST.ps1" "$root/RUN-MK1212-PR45-SP-TEST.ps1"

          @(
            '@echo off',
            'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0RUN-MK1212-PR45-SP-TEST.ps1"',
            'echo.',
            'pause'
          ) | Set-Content -Encoding ASCII "$root/RUN-MK1212-PR45-SP-TEST.cmd"

          @(
            "MK1212 PR45 PRODUCT SP PROOF",
            "============================",
            "Exact source SHA: 13ba7dc5965c43b252de88f7fd4cefe75f1f82b1",
            "",
            "This V2 harness temporarily replaces your active Workshop 1-1212scripts.pack in-place.",
            "Before replacement it makes a byte-for-byte backup, patches only:",
            "  campaigns/main_attila/common/main.lua",
            "  campaigns/main_attila/common/mkmp_runtime.lua",
            "and restores the original Workshop pack in a finally block after evidence capture.",
            "It does NOT edit 20190104-moddata.dat or user.script.txt.",
            "",
            "PRECONDITION:",
            "- Close Attila and CA Launcher.",
            "- Keep Steam running.",
            "",
            "RUN:",
            "- Double-click RUN-MK1212-PR45-SP-TEST.cmd.",
            "- CA Launcher opens. Click PLAY.",
            "- In MK1212 start/load SINGLE PLAYER and reach campaign map.",
            "- Wait ~10 seconds and exit Attila normally.",
            "",
            "RESULT:",
            "- The harness restores the original Workshop scripts pack, DLLs, probes and prior logs even on timeout/error.",
            "- Upload MK1212-PR45-SP-EVIDENCE-*.zip back to ChatGPT.",
            "",
            "PASS requires native and MKMP debug logs to report the exact PR45 runtime adapter as ready."
          ) | Set-Content -Encoding UTF8 "$root/README-FIRST.txt"

          # Parse the runner to catch PowerShell syntax errors before delivery.
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "$root/RUN-MK1212-PR45-SP-TEST.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            throw "Runner PowerShell parse failed"
          }

          Get-ChildItem $root -Recurse -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object {
              $rel = $_.Path.Substring((Resolve-Path $root).Path.Length + 1)
              "$($_.Hash.ToLower())  $rel"
            } | Set-Content -Encoding ASCII "$root/SHA256SUMS.txt"

          Compress-Archive -Path $root -DestinationPath "MK1212-PR45-PRODUCT-SP-PROOF-13ba7dc5965c43b252de88f7fd4cefe75f1f82b1.zip" -Force

      - name: Upload product proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: MK1212-PR45-PRODUCT-SP-PROOF-13ba7dc5965c43b252de88f7fd4cefe75f1f82b1
          path: MK1212-PR45-PRODUCT-SP-PROOF-13ba7dc5965c43b252de88f7fd4cefe75f1f82b1.zip
          retention-days: 7
          if-no-files-found: error
