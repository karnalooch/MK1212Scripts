name: Build MK1212 product SP runtime proof bundle

on:
  push:
    branches:
      - artifact/45-mk1212-product-sp-proof

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: helper

      - name: Checkout exact PR45 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 13ba7dc5965c43b252de88f7fd4cefe75f1f82b1
          path: source

      - name: Assert exact source
        shell: pwsh
        run: |
          Push-Location source
          $actual = (git rev-parse HEAD).Trim()
          Pop-Location
          if ($actual -ne "13ba7dc5965c43b252de88f7fd4cefe75f1f82b1") { throw "Expected 13ba7dc5965c43b252de88f7fd4cefe75f1f82b1, got $actual" }

      - name: Configure and build Attila x86 DLL
        shell: pwsh
        run: |
          cmake -S source/native/twdll -B build/twdll-attila -A Win32 -DTW_GAME=attila -DBUILD_TESTING=ON -DTWDLL_WARNINGS_AS_ERRORS=ON
          cmake --build build/twdll-attila --config Release --target twdll twdll_signature_scanner_tests twdll_log_tests twdll_security_tests --parallel 2
          ctest --test-dir build/twdll-attila -C Release --output-on-failure

      - name: Verify DLL identity
        shell: pwsh
        run: |
          $dll = Resolve-Path "build/twdll-attila/Release/twdll.dll"
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014c) { throw "Expected x86 DLL" }
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $ascii.Contains("luaopen_twdll")) { throw "luaopen_twdll marker missing" }
          if (-not $ascii.Contains("13ba7dc5965c43b252de88f7fd4cefe75f1f82b1")) { throw "Exact source SHA missing from DLL" }

      - name: Install prebuilt RPFM CLI 4.5.4
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Frodo45127/rpfm/releases/download/v4.5.4/rpfm-v4.5.4-x86_64-pc-windows-msvc.zip" -OutFile "rpfm.zip"
          Expand-Archive "rpfm.zip" -DestinationPath "rpfm" -Force
          $cli = Get-ChildItem "rpfm" -Recurse -File | Where-Object { $_.Name -like "rpfm_cli*" } | Select-Object -First 1
          if (-not $cli) { throw "rpfm_cli not found" }
          Write-Host "RPFM CLI: $($cli.FullName)"
          "RPFM_CLI=$($cli.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage exact MK1212 runtime patch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "patch-src/campaigns/main_attila/common" | Out-Null
          Copy-Item "source/campaigns/main_attila/common/main.lua" "patch-src/campaigns/main_attila/common/main.lua"
          Copy-Item "source/campaigns/main_attila/common/mkmp_runtime.lua" "patch-src/campaigns/main_attila/common/mkmp_runtime.lua"

      - name: Prove RPFM clone-and-replace semantics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "base-src/campaigns/main_attila/common" | Out-Null
          "-- OLD_MAIN_SENTINEL" | Set-Content -Encoding ASCII "base-src/campaigns/main_attila/common/main.lua"
          "-- OLD_RUNTIME_SENTINEL" | Set-Content -Encoding ASCII "base-src/campaigns/main_attila/common/mkmp_runtime.lua"

          & "$env:RPFM_CLI" --game attila pack create --pack-path "replacement-proof.pack"
          if ($LASTEXITCODE -ne 0) { throw "RPFM create failed" }
          & "$env:RPFM_CLI" --game attila pack add --pack-path "replacement-proof.pack" -F "base-src;"
          if ($LASTEXITCODE -ne 0) { throw "RPFM base add failed" }
          & "$env:RPFM_CLI" --game attila pack add --pack-path "replacement-proof.pack" -F "patch-src;"
          if ($LASTEXITCODE -ne 0) { throw "RPFM replacement add failed" }

          $raw = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes("replacement-proof.pack"))
          if (-not $raw.Contains("MKMP_RUNTIME_EXPECTED_GAME")) { throw "Patched runtime marker not found in pack" }
          if (-not $raw.Contains("MKMP_Runtime_Initialize")) { throw "Patched bootstrap marker not found in pack" }
          if ($raw.Contains("OLD_RUNTIME_SENTINEL")) { throw "Old runtime payload survived replacement" }

      - name: Assemble product proof bundle
        shell: pwsh
        run: |
          $root = "MK1212-PR45-PRODUCT-SP-PROOF-13ba7dc5965c43b252de88f7fd4cefe75f1f82b1"
          New-Item -ItemType Directory -Force -Path "$root/payload/patch-src/campaigns/main_attila/common" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/tools" | Out-Null

          Copy-Item "build/twdll-attila/Release/twdll.dll" "$root/payload/twdll.dll"
          Copy-Item "build/twdll-attila/Release/twdll.dll" "$root/payload/twdll_attila.dll"
          Copy-Item "patch-src/campaigns/main_attila/common/main.lua" "$root/payload/patch-src/campaigns/main_attila/common/main.lua"
          Copy-Item "patch-src/campaigns/main_attila/common/mkmp_runtime.lua" "$root/payload/patch-src/campaigns/main_attila/common/mkmp_runtime.lua"
          Copy-Item "$env:RPFM_CLI" "$root/tools/rpfm_cli.exe"

          $runner = @(
            'param([string]$ExpectedSourceSha = "13ba7dc5965c43b252de88f7fd4cefe75f1f82b1")',
            '$ErrorActionPreference = "Stop"',
            '$Here = Split-Path -Parent $MyInvocation.MyCommand.Path',
            '$Payload = Join-Path $Here "payload"',
            '$Rpfm = Join-Path $Here "tools\rpfm_cli.exe"',
            '$LauncherDir = Join-Path $env:APPDATA "The Creative Assembly\Launcher"',
            '$ModData = Join-Path $LauncherDir "20190104-moddata.dat"',
            '$AttilaApp = Join-Path $env:APPDATA "The Creative Assembly\Attila"',
            '$ScriptDir = Join-Path $AttilaApp "scripts"',
            '$UserScript = Join-Path $ScriptDir "user.script.txt"',
            '$Stamp = Get-Date -Format "yyyyMMdd-HHmmss"',
            '$Backup = Join-Path $Here ("backup-" + $Stamp)',
            '$Evidence = Join-Path $Here ("evidence-" + $Stamp)',
            'New-Item -ItemType Directory -Force -Path $Backup,$Evidence,$ScriptDir | Out-Null',
            '',
            'if (!(Test-Path $ModData)) { throw "CA Launcher mod data not found: $ModData" }',
            '$mods = @(Get-Content $ModData -Raw | ConvertFrom-Json)',
            '$scriptMod = $mods | Where-Object { $_.uuid -eq "1-1212scripts.pack" } | Select-Object -First 1',
            'if (-not $scriptMod) { throw "MK1212 Workshop scripts pack (1-1212scripts.pack) not found in launcher moddata" }',
            '',
            '$workshopScripts = [string]$scriptMod.packfile',
            'if (!(Test-Path $workshopScripts)) { throw "Workshop scripts pack not found: $workshopScripts" }',
            '$normalized = $workshopScripts.Replace("/","\")',
            '$token = "\steamapps\workshop\content\325610\"',
            '$idx = $normalized.ToLowerInvariant().IndexOf($token)',
            'if ($idx -lt 0) { throw "Cannot derive Steam library from workshop path: $normalized" }',
            '$steamApps = $normalized.Substring(0, $idx + "\steamapps".Length)',
            '$GameRoot = Join-Path $steamApps "common\Total War Attila"',
            '$Data = Join-Path $GameRoot "data"',
            '$Exe = Join-Path $GameRoot "Attila.exe"',
            '$LocalPack = Join-Path $Data "mk1212_pr45_runtime_scripts.pack"',
            '$Twdll = Join-Path $GameRoot "twdll.dll"',
            '$TwdllAttila = Join-Path $GameRoot "twdll_attila.dll"',
            '$NativeLog = Join-Path $GameRoot "twdll.log"',
            '$DebugLog = Join-Path $GameRoot "MK1212_mp_debug.log"',
            '',
            'if (!(Test-Path $Exe)) { throw "Attila.exe not found: $Exe" }',
            'if (!(Test-Path $Rpfm)) { throw "Bundled rpfm_cli.exe missing" }',
            '',
            'Write-Host "=== MK1212 PR45 PRODUCT SP PROOF ===" -ForegroundColor Cyan',
            'Write-Host "Game root: $GameRoot"',
            'Write-Host "Workshop scripts: $workshopScripts"',
            'Write-Host "Exact source: $ExpectedSourceSha"',
            '',
            '# Backup everything this harness mutates.',
            'Copy-Item $ModData (Join-Path $Backup "20190104-moddata.dat") -Force',
            'if (Test-Path $UserScript) { Copy-Item $UserScript (Join-Path $Backup "user.script.txt") -Force }',
            'foreach ($p in @($LocalPack,$Twdll,$TwdllAttila,$NativeLog,$DebugLog)) {',
            '  if (Test-Path $p) { Copy-Item $p (Join-Path $Backup ([IO.Path]::GetFileName($p))) -Force }',
            '}',
            '$probeNames = @("mk1212_twdll_sp_probe.pack","zzz_mk1212_twdll_sp_probe_v2.pack","zzz_mk1212_twdll_sp_probe_v3.pack","000_mk1212_twdll_sp_probe_v4_movie.pack")',
            'foreach ($name in $probeNames) {',
            '  $p = Join-Path $Data $name',
            '  if (Test-Path $p) { Copy-Item $p (Join-Path $Backup $name) -Force; Remove-Item $p -Force }',
            '}',
            '',
            '# Clone the exact Workshop scripts pack, then replace only the two PR45 Lua files.',
            'Copy-Item $workshopScripts $LocalPack -Force',
            '& $Rpfm --game attila pack add --pack-path $LocalPack -F ((Join-Path $Payload "patch-src") + ";")',
            'if ($LASTEXITCODE -ne 0) { throw "RPFM failed to patch the cloned MK1212 scripts pack" }',
            '',
            '# Install exact native DLL and start with clean runtime logs.',
            'Copy-Item (Join-Path $Payload "twdll.dll") $Twdll -Force',
            'Copy-Item (Join-Path $Payload "twdll_attila.dll") $TwdllAttila -Force',
            'Remove-Item $NativeLog,$DebugLog -Force -ErrorAction SilentlyContinue',
            '',
            '# Disable the Workshop scripts pack in launcher state. Keep every other active mod unchanged.',
            'foreach ($m in $mods) {',
            '  if ($m.uuid -eq "1-1212scripts.pack") { $m.active = $false }',
            '  if ($m.uuid -like "*twdll*probe*") { $m.active = $false }',
            '}',
            '$mods | ConvertTo-Json -Depth 8 -Compress | Set-Content -Encoding UTF8 $ModData',
            '',
            '# Force-load the local cloned scripts pack without asking the launcher to index it.',
            'if (Test-Path $UserScript) { (Get-Item $UserScript).IsReadOnly = $false }',
            '''mod "mk1212_pr45_runtime_scripts.pack";'' | Set-Content -Encoding ASCII $UserScript',
            '(Get-Item $UserScript).IsReadOnly = $true',
            '',
            '# Record pre-launch provenance.',
            '$manifest = [ordered]@{',
            '  source_sha = $ExpectedSourceSha',
            '  started_at = (Get-Date).ToString("o")',
            '  game_root = $GameRoot',
            '  workshop_scripts_pack = $workshopScripts',
            '  workshop_scripts_sha256 = (Get-FileHash $workshopScripts -Algorithm SHA256).Hash.ToLower()',
            '  patched_scripts_sha256 = (Get-FileHash $LocalPack -Algorithm SHA256).Hash.ToLower()',
            '  attila_sha256 = (Get-FileHash $Exe -Algorithm SHA256).Hash.ToLower()',
            '  empire_retail_sha256 = if (Test-Path (Join-Path $GameRoot "empire.retail.dll")) { (Get-FileHash (Join-Path $GameRoot "empire.retail.dll") -Algorithm SHA256).Hash.ToLower() } else { $null }',
            '  twdll_sha256 = (Get-FileHash $Twdll -Algorithm SHA256).Hash.ToLower()',
            '}',
            '$manifest | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $Evidence "manifest.json")',
            'Copy-Item $ModData (Join-Path $Evidence "moddata.used.json") -Force',
            'Copy-Item $UserScript (Join-Path $Evidence "user.script.used.txt") -Force',
            '',
            'Write-Host ""',
            'Write-Host "Opening Steam/CA Launcher. Click PLAY." -ForegroundColor Yellow',
            'Write-Host "In MK1212 start/load SINGLE PLAYER and reach the campaign map. Wait ~10 seconds, then exit Attila normally." -ForegroundColor Yellow',
            'Start-Process "steam://rungameid/325610"',
            '',
            '$deadline = (Get-Date).AddMinutes(10)',
            '$proc = $null',
            'while (-not $proc) {',
            '  $proc = Get-Process -Name "Attila" -ErrorAction SilentlyContinue | Sort-Object StartTime -Descending | Select-Object -First 1',
            '  if ($proc) { break }',
            '  if ((Get-Date) -gt $deadline) { throw "Timed out waiting 10 minutes for Attila.exe. Close the launcher and rerun." }',
            '  Start-Sleep -Seconds 1',
            '}',
            'Write-Host "Detected Attila PID $($proc.Id). Waiting for game exit..." -ForegroundColor Cyan',
            '',
            '$runError = $null',
            'try {',
            '  Wait-Process -Id $proc.Id',
            '  Start-Sleep -Seconds 3',
            '} catch {',
            '  $runError = $_.Exception.Message',
            '} finally {',
            '  # Capture fresh evidence BEFORE restoring previous files.',
            '  if (Test-Path $NativeLog) { Copy-Item $NativeLog (Join-Path $Evidence "twdll.log") -Force }',
            '  if (Test-Path $DebugLog) { Copy-Item $DebugLog (Join-Path $Evidence "MK1212_mp_debug.log") -Force }',
            '  foreach ($name in @("MK1212_log.txt","MK1212_config.txt")) {',
            '    $p = Join-Path $GameRoot $name; if (Test-Path $p) { Copy-Item $p (Join-Path $Evidence $name) -Force }',
            '  }',
            '  $result = [ordered]@{ source_sha = $ExpectedSourceSha; native_ready = $false; debug_ready = $false; run_error = $runError }',
            '  if (Test-Path $NativeLog) {',
            '    $txt = Get-Content $NativeLog -Raw',
            '    $result.native_ready = $txt.Contains("[MKMP][RUNTIME] ready game=Attila twdll_sha=" + $ExpectedSourceSha)',
            '  }',
            '  if (Test-Path $DebugLog) {',
            '    $dbg = Get-Content $DebugLog -Raw',
            '    $result.debug_ready = $dbg.Contains("event=runtime") -and $dbg.Contains("available=true") -and $dbg.Contains("reason=ready")',
            '  }',
            '  $result | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $Evidence "result.json")',
            '',
            '  # Restore local environment.',
            '  try { if (Test-Path $UserScript) { (Get-Item $UserScript).IsReadOnly = $false } } catch {}',
            '  Copy-Item (Join-Path $Backup "20190104-moddata.dat") $ModData -Force',
            '  if (Test-Path (Join-Path $Backup "user.script.txt")) { Copy-Item (Join-Path $Backup "user.script.txt") $UserScript -Force } else { Remove-Item $UserScript -Force -ErrorAction SilentlyContinue }',
            '  foreach ($p in @($LocalPack,$Twdll,$TwdllAttila,$NativeLog,$DebugLog)) { Remove-Item $p -Force -ErrorAction SilentlyContinue }',
            '  foreach ($name in @("mk1212_pr45_runtime_scripts.pack","twdll.dll","twdll_attila.dll","twdll.log","MK1212_mp_debug.log")) {',
            '    $b = Join-Path $Backup $name',
            '    if (Test-Path $b) {',
            '      $dest = if ($name -eq "mk1212_pr45_runtime_scripts.pack") { $LocalPack } else { Join-Path $GameRoot $name }',
            '      Copy-Item $b $dest -Force',
            '    }',
            '  }',
            '  foreach ($name in $probeNames) { $b = Join-Path $Backup $name; if (Test-Path $b) { Copy-Item $b (Join-Path $Data $name) -Force } }',
            '',
            '  $zip = Join-Path $Here ("MK1212-PR45-SP-EVIDENCE-" + $Stamp + ".zip")',
            '  Compress-Archive -Path "$Evidence\*" -DestinationPath $zip -Force',
            '  Write-Host ""',
            '  if ($result.native_ready -and $result.debug_ready) {',
            '    Write-Host "PRODUCT RUNTIME RESULT: PASS" -ForegroundColor Green',
            '  } else {',
            '    Write-Host "PRODUCT RUNTIME RESULT: NOT PROVEN - inspect evidence" -ForegroundColor Red',
            '  }',
            '  Write-Host "Evidence ZIP: $zip"',
            '  Write-Host "Launcher moddata/user.script/DLLs/probes/logs restored."',
            '}'
          )
          $runner | Set-Content -Encoding UTF8 "$root/RUN-MK1212-PR45-SP-TEST.ps1"

          @(
            '@echo off',
            'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0RUN-MK1212-PR45-SP-TEST.ps1"',
            'echo.',
            'pause'
          ) | Set-Content -Encoding ASCII "$root/RUN-MK1212-PR45-SP-TEST.cmd"

          @(
            "MK1212 PR45 PRODUCT SP PROOF",
            "============================",
            "Exact source SHA: 13ba7dc5965c43b252de88f7fd4cefe75f1f82b1",
            "",
            "This harness does NOT edit the Steam Workshop pack.",
            "It clones your active 1-1212scripts.pack into Attila/data, replaces only:",
            "  campaigns/main_attila/common/main.lua",
            "  campaigns/main_attila/common/mkmp_runtime.lua",
            "then temporarily disables the Workshop scripts component in CA Launcher state.",
            "",
            "PRECONDITION:",
            "- Close Attila and CA Launcher.",
            "- Keep Steam running.",
            "",
            "RUN:",
            "- Double-click RUN-MK1212-PR45-SP-TEST.cmd.",
            "- CA Launcher opens. Click PLAY.",
            "- In MK1212 start/load SINGLE PLAYER and reach campaign map.",
            "- Wait ~10 seconds and exit Attila normally.",
            "",
            "RESULT:",
            "- The harness restores launcher state, user.script, DLLs, probes and prior logs.",
            "- Upload MK1212-PR45-SP-EVIDENCE-*.zip back to ChatGPT.",
            "",
            "PASS requires native and MKMP debug logs to report the exact PR45 runtime adapter as ready."
          ) | Set-Content -Encoding UTF8 "$root/README-FIRST.txt"

          # Parse the runner to catch PowerShell syntax errors before delivery.
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "$root/RUN-MK1212-PR45-SP-TEST.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            throw "Runner PowerShell parse failed"
          }

          Get-ChildItem $root -Recurse -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object {
              $rel = $_.Path.Substring((Resolve-Path $root).Path.Length + 1)
              "$($_.Hash.ToLower())  $rel"
            } | Set-Content -Encoding ASCII "$root/SHA256SUMS.txt"

          Compress-Archive -Path $root -DestinationPath "MK1212-PR45-PRODUCT-SP-PROOF-13ba7dc5965c43b252de88f7fd4cefe75f1f82b1.zip" -Force

      - name: Upload product proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: MK1212-PR45-PRODUCT-SP-PROOF-13ba7dc5965c43b252de88f7fd4cefe75f1f82b1
          path: MK1212-PR45-PRODUCT-SP-PROOF-13ba7dc5965c43b252de88f7fd4cefe75f1f82b1.zip
          retention-days: 7
          if-no-files-found: error
